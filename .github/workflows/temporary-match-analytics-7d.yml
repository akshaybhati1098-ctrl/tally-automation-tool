name: Apply Match Analytics 7-Day Filter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-match-analytics:
    if: github.actor == 'akshaybhati1098-ctrl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply minimal 7-day filter
        shell: python
        run: |
          from pathlib import Path

          path = Path("routes/admin_routes.py")
          text = path.read_text(encoding="utf-8")

          old_users = '''cur.execute("SELECT DISTINCT username FROM business_events WHERE username IS NOT NULL AND username != '' ORDER BY username ASC")'''
          new_users = '''cur.execute("SELECT DISTINCT username FROM business_events WHERE username IS NOT NULL AND username != '' AND created_at >= NOW() - INTERVAL '7 days' ORDER BY username ASC")'''

          if old_users not in text:
              raise SystemExit("Expected user-filter query was not found; refusing to modify the file.")

          text = text.replace(old_users, new_users, 1)

          old_where = '''where_clauses = ["event_type = 'match_party'"]'''
          new_where = '''where_clauses = ["event_type = 'match_party'", "created_at >= NOW() - INTERVAL '7 days'"]'''

          if old_where not in text:
              raise SystemExit("Expected match analytics filter was not found; refusing to modify the file.")

          text = text.replace(old_where, new_where, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit application change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/admin_routes.py
          git diff --cached --exit-code && { echo "No change needed"; exit 0; } || true
          git commit -m "Limit match analytics to past 7 days"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/temporary-match-analytics-7d.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/temporary-match-analytics-7d.yml
          git commit -m "Remove temporary analytics patch workflow"
          git push
